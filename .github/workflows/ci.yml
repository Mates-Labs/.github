name: Mates-Labs CI (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${archive_path}"

          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive_path}" | sha256sum --check

          mkdir -p "${install_dir}"
          tar -xzf "${archive_path}" -C "${install_dir}" gitleaks
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan repository history for secrets
        run: gitleaks git --redact --verbose --exit-code 1

  quality:
    name: Lint, format, types, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect project tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail

          node_project=false
          python_project=false
          playwright_project=false

          if [[ -f package.json ]]; then
            if ! jq -e 'type == "object"' package.json >/dev/null; then
              echo "::error::package.json must contain a valid JSON object; CI cannot reliably detect Node.js checks."
              exit 1
            fi
          fi

          if [[ -f package.json ]] && jq -e '
            ((.scripts // {}) |
              (has("lint") or
               has("format:check") or
               has("check:format") or
               has("typecheck") or
               has("type-check") or
               has("check-types") or
               has("test") or
               has("test:ci") or
               has("build")))
            or
            ((.dependencies // {}) | length > 0)
            or
            ((.devDependencies // {}) | length > 0)
            or
            ((.optionalDependencies // {}) | length > 0)
            or
            ((.peerDependencies // {}) | length > 0)
          ' package.json >/dev/null; then
            node_project=true
          fi

          playwright_config=''
          for candidate in playwright.config.js playwright.config.ts playwright.config.mjs playwright.config.cjs; do
            if [[ -f "${candidate}" ]]; then
              playwright_config="${candidate}"
              break
            fi
          done

          if [[ -n "${playwright_config}" ]]; then
            if [[ ! -f package.json ]]; then
              echo "::error::${playwright_config} exists, but package.json is missing. Declare Playwright as a project dependency."
              exit 1
            fi
            if ! jq -e '
              ((.dependencies // {}) | has("@playwright/test") or has("playwright"))
              or ((.devDependencies // {}) | has("@playwright/test") or has("playwright"))
            ' package.json >/dev/null; then
              echo "::error::${playwright_config} exists, but @playwright/test or playwright is not declared in package.json. Add the runner as a dependency."
              exit 1
            fi
            playwright_project=true
          fi

          if find . \
            \( -path './.git' -o -path './node_modules' -o -path './.venv' \
               -o -path './venv' -o -path './.tox' -o -path './.nox' \
               -o -path './dist' -o -path './build' -o -path '*/site-packages' \
               -o -path '*/__pycache__' \) -prune \
            -o -type f -name '*.py' -print -quit | grep -q .; then
            python_project=true
          fi

          echo "node_project=${node_project}" >> "${GITHUB_OUTPUT}"
          echo "python_project=${python_project}" >> "${GITHUB_OUTPUT}"
          echo "playwright_project=${playwright_project}" >> "${GITHUB_OUTPUT}"

          {
            echo "## CI project detection"
            echo "- Node.js project detected: ${node_project}"
            echo "- Python project detected: ${python_project}"
            echo "- Playwright E2E project detected: ${playwright_project}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${node_project}" != 'true' ]]; then
            echo "::notice::No Node.js project detected; Node.js checks will not apply."
          fi
          if [[ "${python_project}" != 'true' ]]; then
            echo "::notice::No Python project detected; Python checks will not apply."
          fi
          if [[ "${playwright_project}" != 'true' ]]; then
            echo "::notice::No Playwright configuration detected; Playwright E2E checks will not apply."
          fi

      - name: Set up Node.js
        if: steps.tools.outputs.node_project == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        if: steps.tools.outputs.python_project == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install npm dependencies
        if: steps.tools.outputs.node_project == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f npm-shrinkwrap.json || -f package-lock.json ]]; then
            if [[ -f npm-shrinkwrap.json ]]; then
              lockfile='npm-shrinkwrap.json'
            else
              lockfile='package-lock.json'
            fi
            echo "::notice::Installing from ${lockfile} with npm ci; dependency lifecycle scripts are disabled."
            echo "- Node dependencies: npm ci from ${lockfile}; install lifecycle scripts disabled." >> "${GITHUB_STEP_SUMMARY}"
            npm ci --ignore-scripts
          elif jq -e '
            [.dependencies // {}, .devDependencies // {}, .optionalDependencies // {}, .peerDependencies // {}]
            | any(.[]; length > 0)
          ' package.json >/dev/null; then
            echo "::error::Node dependencies are declared, but no package-lock.json or npm-shrinkwrap.json exists. Commit a lockfile so CI can install deterministically."
            exit 1
          else
            echo "::notice::No npm lockfile found; dependency installation skipped. Add a lockfile if this project needs npm dependencies."
            echo "- Node dependency installation skipped: no npm lockfile." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install declared Python requirements
        if: steps.tools.outputs.python_project == 'true'
        shell: bash
        run: |
          set -euo pipefail

          requirements_found=false
          for requirements in requirements.txt requirements-dev.txt; do
            if [[ -f "${requirements}" ]]; then
              requirements_found=true
              python -m pip install -r "${requirements}"
            fi
          done
          if [[ "${requirements_found}" != 'true' ]]; then
            echo "::notice::No requirements.txt or requirements-dev.txt found; Python dependency installation skipped."
            echo "- Python dependency installation skipped: no requirements files." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Run available npm checks
        if: steps.tools.outputs.node_project == 'true'
        shell: bash
        run: |
          set -euo pipefail

          skip_check() {
            echo "::notice::$1"
            echo "- $1" >> "${GITHUB_STEP_SUMMARY}"
          }

          has_script() {
            jq -e --arg name "$1" '(.scripts // {}) | has($name)' package.json >/dev/null
          }

          has_dependency() {
            jq -e --arg name "$1" '
              ((.dependencies // {}) | has($name))
              or
              ((.devDependencies // {}) | has($name))
              or
              ((.optionalDependencies // {}) | has($name))
              or
              ((.peerDependencies // {}) | has($name))
            ' package.json >/dev/null
          }

          select_script() {
            local candidate
            for candidate in "$@"; do
              if has_script "${candidate}"; then
                printf '%s' "${candidate}"
                return 0
              fi
            done
            return 1
          }

          script="$(select_script lint)" || script=""
          if [[ -n "${script}" ]]; then
            npm run "${script}"
          elif has_dependency eslint && [[ -x node_modules/.bin/eslint ]]; then
            ./node_modules/.bin/eslint .
          else
            skip_check 'Lint not configured; skipped.'
          fi

          script="$(select_script format:check check:format)" || script=""
          if [[ -n "${script}" ]]; then
            npm run "${script}"
          elif has_dependency prettier && [[ -x node_modules/.bin/prettier ]]; then
            ./node_modules/.bin/prettier --check .
          else
            skip_check 'Format check not configured; skipped.'
          fi

          script="$(select_script typecheck type-check check-types)" || script=""
          if [[ -n "${script}" ]]; then
            npm run "${script}"
          elif [[ -f tsconfig.json ]] &&
               has_dependency typescript &&
               [[ -x node_modules/.bin/tsc ]]; then
            ./node_modules/.bin/tsc --noEmit
          else
            skip_check 'Type check not configured; skipped.'
          fi

          script="$(select_script test:ci test)" || script=""
          if [[ -n "${script}" ]]; then
            npm run "${script}"
          elif [[ -x node_modules/.bin/vitest ]]; then
            ./node_modules/.bin/vitest run
          elif [[ -x node_modules/.bin/jest ]]; then
            ./node_modules/.bin/jest --runInBand
          else
            skip_check 'Node tests not configured; skipped.'
          fi

          script="$(select_script build)" || script=""
          if [[ -n "${script}" ]]; then
            npm run "${script}"
          elif has_dependency vite && [[ -x node_modules/.bin/vite ]]; then
            ./node_modules/.bin/vite build
          else
            skip_check 'Build not configured; skipped.'
          fi

      - name: Run available Python checks
        if: steps.tools.outputs.python_project == 'true'
        shell: bash
        run: |
          set -euo pipefail

          skip_check() {
            echo "::notice::$1"
            echo "- $1" >> "${GITHUB_STEP_SUMMARY}"
          }

          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check .
            python -m ruff format --check .
          else
            skip_check 'Ruff is not installed; Python lint and format checks skipped.'
          fi

          if python -m mypy --version >/dev/null 2>&1; then
            python -m mypy .
          else
            skip_check 'Mypy is not installed; Python type check skipped.'
          fi

          mapfile -d '' python_test_files < <(
            find . \
              \( -path './.git' -o -path './node_modules' -o -path './.venv' \
                 -o -path './venv' -o -path './.tox' -o -path './.nox' \
                 -o -path './dist' -o -path './build' -o -path './__pycache__' \
                 -o -path '*/site-packages' -o -path '*/__pycache__' \) -prune \
              -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print0
          )

          if (( ${#python_test_files[@]} > 0 )); then
            echo "::notice::Detected ${#python_test_files[@]} Python test file(s). A test runner must discover and execute them."
            if python -m pytest --version >/dev/null 2>&1; then
              echo "- Python tests: pytest detected; running discovered tests." >> "${GITHUB_STEP_SUMMARY}"
              python -m pytest
            else
              echo "::notice::pytest is unavailable; checking unittest discovery and test counts."
              echo "- Python tests: unittest fallback; every detected file must execute at least one test." >> "${GITHUB_STEP_SUMMARY}"
              python - "${python_test_files[@]}" <<'PY'
          import ast
          import pathlib
          import re
          import subprocess
          import sys

          paths = [pathlib.Path(value) for value in sys.argv[1:]]
          total = 0

          for path in paths:
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"))
              except (OSError, SyntaxError) as error:
                  print(f"::error::Could not inspect Python test file {path}: {error}")
                  sys.exit(1)

              has_pytest_function = any(
                  isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name.startswith("test_")
                  for node in tree.body
              )
              has_pytest_class = any(
                  isinstance(node, ast.ClassDef)
                  and node.name.startswith("Test")
                  and any(
                      isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and member.name.startswith("test_")
                      for member in node.body
                  )
                  and not any(
                      ast.unparse(base).endswith("TestCase")
                      for base in node.bases
                  )
                  for node in tree.body
              )
              if has_pytest_function or has_pytest_class:
                  print(
                      f"::error::pytest-style tests found in {path}, but pytest is unavailable. "
                      "Declare pytest in a requirements file; unittest would skip these tests."
                  )
                  sys.exit(1)

              result = subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "unittest",
                      "discover",
                      "-s",
                      str(path.parent),
                      "-p",
                      path.name,
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              print(result.stdout, end="")
              normalized_output = result.stdout.replace("\r\n", "\n")
              match = re.search(r"^Ran (\d+) tests?\b", normalized_output, re.MULTILINE)
              count = int(match.group(1)) if match else 0
              if count == 0:
                  if result.returncode not in (0, 5):
                      print(f"::error::unittest failed while inspecting {path}.")
                      sys.exit(result.returncode)
                  print(
                      f"::notice::unittest found no cases in {path}; treating it as a test helper file."
                  )
                  continue
              if result.returncode != 0:
                  print(f"::error::unittest failed while running {path}.")
                  sys.exit(result.returncode)
              total += count

          if total == 0:
              print("::error::Python test files were detected, but no tests were executed.")
              sys.exit(1)

          print(f"Unittest executed {total} test case(s) across {len(paths)} file(s).")
          PY
            fi
          else
            skip_check 'No Python test files found; Python tests skipped.'
          fi

          if [[ ! -f pyproject.toml ]]; then
            skip_check 'No pyproject.toml found; Python package build not applicable.'
          elif python -m build --version >/dev/null 2>&1; then
            python -m build
          else
            skip_check 'pyproject.toml exists but the build module is unavailable; Python package build skipped.'
          fi

      - name: Install Playwright browsers and system dependencies
        if: steps.tools.outputs.playwright_project == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright UI, visual, and accessibility tests
        if: steps.tools.outputs.playwright_project == 'true'
        run: npx playwright test
